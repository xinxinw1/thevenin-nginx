# Every nginx server_name, the certificate path and phpmyadmin's absolute URI
# come from SITE_DOMAIN instead of being hard-coded, so the same checkout can
# serve new.xin-xin.me, xin-xin-test.me or localhost. It and DATA_DIR are inputs
# this repo does not answer for: on a droplet ~/setup.sh writes a .env from the
# host type, and otherwise they come from a file passed with
# `docker compose --env-file` (.env.dev for localhost) or from .env.example.
x-site-env: &site-env
  # The nginx image renders /etc/nginx/templates/*.template into
  # /etc/nginx/conf.d at startup, substituting environment variables. The filter
  # keeps envsubst to SITE_* so nginx's own $host, $request_uri and friends
  # survive into the generated config untouched.
  NGINX_ENVSUBST_FILTER: "^SITE_"
  # Also the certbot lineage name, i.e. the directory under certbot/conf/live
  # holding fullchain.pem and privkey.pem.
  SITE_DOMAIN: ${SITE_DOMAIN:?no .env -- run ~/setup.sh, or copy .env.example}

services:
  webserver-insecure:
    image: nginx
    ports:
      - 80:80
    restart: unless-stopped
    environment: *site-env
    volumes:
      - ./templates-insecure/:/etc/nginx/templates/:ro
      - ${DATA_DIR}/certbot/www/:/var/www/certbot/:ro
  webserver-secure:
    image: nginx
    ports:
      - 443:443
    restart: unless-stopped
    environment: *site-env
    volumes:
      - ./templates-secure/:/etc/nginx/templates/:ro
      - ${DATA_DIR}/certbot/conf/:/etc/letsencrypt/:ro
    # Reload every 6h so a renewed certificate gets picked up without a restart.
    # The image only renders the templates when its entrypoint is handed `nginx`
    # as the first argument, and a custom command hands it `/bin/sh` instead --
    # hence the explicit `/docker-entrypoint.sh nginx` rather than a bare
    # `nginx`, which would start the server with no conf.d at all.
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g \"daemon off;\"'"
  certbot: &certbot
    image: certbot/certbot
    environment: *site-env
    volumes:
      - ${DATA_DIR}/certbot/www/:/var/www/certbot/:rw
      - ${DATA_DIR}/certbot/conf/:/etc/letsencrypt/:rw
    profiles:
      - donotstart
  certbot-autorenew:
    <<: *certbot
    profiles: []
    restart: unless-stopped
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
  main-website:
    image: xinxinw/xin-xin.me
    restart: unless-stopped
  text-edit:
    image: xinxinw/text-edit
    restart: unless-stopped
    volumes:
      - ${DATA_DIR}/text-edit-data/:/var/www/html/data/:rw
  mysql:
    image: mysql
    restart: unless-stopped
    volumes:
      - ${DATA_DIR}/mysql/data/:/var/lib/mysql/:rw
    # Kept out of git; see .env.secrets.example. Only honored when the mysql
    # data directory is empty, so an existing volume keeps its own password.
    env_file:
      - .env.secrets
  phpmyadmin:
    image: phpmyadmin
    restart: unless-stopped
    links:
      - mysql:db
    environment:
      - PMA_ABSOLUTE_URI=https://${SITE_DOMAIN}/phpmyadmin/
